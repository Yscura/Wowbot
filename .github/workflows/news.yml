name: Post WoW Forever news

on:
  schedule:
    - cron: "*/15 * * * *"  # GitHub often runs scheduled jobs a few minutes late
  workflow_dispatch:  # adds a "Run workflow" button for manual runs

permissions:
  contents: write  # needed to commit state/seen.json back to the repo

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check feeds and post
        run: python webhook.py
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          STATE_FILE: state/seen.json

      - name: Save posted-article state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || git commit -m "Update seen articles"
          git push
